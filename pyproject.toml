[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-studio"
version = "1.0.0"
description = "A native Windows PDF toolkit: merge, split, compress, convert, edit, sign and protect PDFs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "PyMuPDF>=1.24",
    "pypdf>=5.0",
    "pdf2docx>=0.5.8",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]

[project.gui-scripts]
pdf-studio = "pdfstudio.gui.app:main"

[tool.setuptools.packages.find]
include = ["pdfstudio*"]
